# Configuration for the dev tooling (formatting and type checking).
#
# This file holds tool config only -- there is deliberately no [build-system]
# table, so aiab stays a run-from-a-checkout tool (symlink bin/aiab) rather than
# a pip-installable package. flake8 is configured separately in .flake8 (it
# doesn't read pyproject.toml). See the README "Development" section for how to
# run these.

[tool.black]
line-length = 88
# Deliberately behind the mypy pin below: this controls the syntax black may
# *emit*, and py314 would rewrite `except (A, B):` to the PEP 758 bare form,
# which is a SyntaxError on older Pythons. aiab is run from a checkout, so
# keeping it parseable there costs nothing and fails more kindly.
target-version = ["py312"]

[tool.mypy]
# aiab targets Ubuntu 26.04+, which ships Python 3.14; check against that.
python_version = "3.14"
files = ["aiab", "tests"]
# A reasonable baseline: warn on obviously-untyped or dead constructs without
# demanding full strictness across every internal helper.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true

# PyYAML ships no type stubs in this environment; we only use safe_load.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# Textual is optional (the richer `aiab monitor` UI; aiab.cli falls back to
# the plain console without it), so type checking must work where it isn't
# installed. Where it is, its real types are used and this is a no-op.
[[tool.mypy.overrides]]
module = ["textual", "textual.*"]
ignore_missing_imports = true
